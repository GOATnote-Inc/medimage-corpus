[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medimage-corpus"
version = "0.1.0"
description = "Registry, conversion, and download tooling for a medical imaging training corpus."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "GOATnote", email = "b@thegoatnote.com" },
]
keywords = ["medical-imaging", "dicom", "nifti", "dataset", "corpus"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pydicom>=2.4",
    "nibabel>=5.2",
    "simpleitk>=2.3",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "jsonschema>=4.21",
    "tqdm>=4.66",
    "click>=8.1",
]

[project.optional-dependencies]
convert = [
    "monai>=1.3",
    "webdataset>=0.2.86",
    "datasets>=2.18",
    "opencv-python>=4.9",
    "decord>=0.6",
    "pillow>=10.2",
]
download = [
    "huggingface-hub>=0.22",
    "kaggle>=1.6",
    "awscli>=1.32",
    "synapseclient>=4.0",
    "tcia-utils>=2.0",
]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/GOATnote-Inc/medimage-corpus"
Issues = "https://github.com/GOATnote-Inc/medimage-corpus/issues"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "data",
    "_downloads",
    "_extract",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
