name: manifest-validate

on:
  push:
    branches: [main]
    paths:
      - "manifests/**"
      - "schemas/**"
      - "scripts/manifest/**"
      - "pyproject.toml"
      - ".github/workflows/manifest-validate.yml"
  pull_request:
    paths:
      - "manifests/**"
      - "schemas/**"
      - "scripts/manifest/**"
      - "pyproject.toml"
      - ".github/workflows/manifest-validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install validation deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema click ruff

      - name: Aggregate + validate manifests
        run: |
          python scripts/manifest/aggregate.py
          python scripts/manifest/validate.py manifests/all.jsonl

      - name: Lint Python (ruff)
        run: |
          ruff check scripts/
