name: manifest-validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install validation deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema click ruff==0.16.5

      - name: Aggregate + validate manifests
        run: |
          python scripts/manifest/aggregate.py
          python scripts/manifest/validate.py manifests/all.jsonl

      - name: Aggregate output is committed (no drift)
        run: git diff --exit-code manifests/all.jsonl

      - name: Dispatcher dry-run smoke (every id)
        run: |
          python - <<'EOF' > /tmp/ids.txt
          import json
          for line in open('manifests/all.jsonl'):
              r = json.loads(line)
              print(r['modality'].lower() + '/' + r['id'])
          EOF
          ok=0; manual=0; fail=0
          while read -r id; do
            bash scripts/download/get.sh "$id" --dry-run >/dev/null 2>&1; rc=$?
            case $rc in
              0) ok=$((ok+1));;
              3) manual=$((manual+1)); echo "manual: $id";;
              *) fail=$((fail+1)); echo "FAIL($rc): $id"; bash scripts/download/get.sh "$id" --dry-run || true;;
            esac
          done < /tmp/ids.txt
          echo "dry-run smoke: ok=$ok manual=$manual fail=$fail"
          test "$fail" -eq 0

      - name: Lint Python (ruff)
        run: |
          ruff check scripts/
